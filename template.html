<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <link rel="stylesheet" href="{{MDWDS_CSS}}" />
    <style>
      html,
      body { margin: 0; padding: 0; background: #fff; }

      #main-content{max-width:1360px;margin:0 auto;padding:12px 24px 18px;}
      .breadcrumb-wrap{max-width:1360px;margin:0 auto;padding:0rem 24px 0;}

      .maryland-header {
        padding-bottom: .5rem;
      }

      .usa-prose {
        padding: 1rem 0;
        /* max-width: 72rem;  */
        margin: 0 auto; }

      .usa-prose p {
        margin-top: 1rem;
       }
       .usa-prose hr {
        margin-top: 4rem;
        margin-bottom: 6rem;
       }

      .usa-prose h2,
      .usa-prose h3,
      .usa-prose h4 {
        margin-top: 2rem;
      }

      .usa-prose h2 {
        margin-top: 4rem;
      }


      .usa-prose h2.no-top-padding {
        margin-top: 0em;
      }

      .usa-prose p,
      .usa-prose li,
      .usa-prose ol li,
      .usa-prose ul li,
      .usa-prose h1,
      .usa-prose h2,
      .usa-prose h3,
      .usa-prose h4 {
        max-width: 920px;
      }

      .usa-summary-box__heading {
        font-size: 1.16rem;
        margin-top: .75rem;
      }

      .usa-prose table td {
        line-height: 1.4rem;
      }

      .usa-prose ol {
        margin-top: 1rem;
      }

       .usa-button {
        padding: .9rem 1.25rem; margin-right: .5rem;
       }

      /* Table of contents block (`## Heading {.toc}` + list). Two-column
         on desktop, single column on narrow screens. Modelled on the
         Sections list at digital.maryland.gov. */
        table.usa-table {
          max-width: 1100px;
        }

      .section-toc {
        border-top: 2px solid #1b1b1b;
        border-bottom: 1px solid #dfe1e2;
        padding: 1.25rem 0 2.5rem;
        margin: 2.5rem 0;
        max-width: 1100px;
      }
      .section-toc__title {
        font-weight: 700;
        font-size: 1rem;
        margin: 0 0 1rem 0;
        color: #1b1b1b;
      }
      .section-toc__list {
        list-style: none;
        padding: 0;
        margin: 0;
        columns: 2;
        column-gap: 2.5rem;
      }
      .section-toc__list li {
        padding-left: 1.25rem;
        position: relative;
        margin: 0 0 0.75rem 0;
        break-inside: avoid;
        line-height: 1.4;
      }
      .section-toc__list li::before {
        content: "•";
        color: #b50909;         /* Maryland red */
        position: absolute;
        left: 0.25rem;
        top: -0.15rem;
        font-size: 1.25rem;
        line-height: 1;
      }
      .section-toc__list a {
        color: #005ea2;         /* USWDS primary blue */
        text-decoration: underline;
      }
      .section-toc__list a:hover { text-decoration-thickness: 2px; }
      @media (max-width: 640px) { .section-toc__list { columns: 1; } }

      /* Multi-column TOC (`### … {.toc-column}` groups). Each column has a
         bold heading, then a stack of linked rows separated by thin rules,
         with a right-pointing arrow per row. Modelled on the section grids
         at digital.maryland.gov. */
      .section-toc-columns {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 2rem 4rem;
        margin: 2rem 0;
      }
      .section-toc-column__title {
        font-weight: 700;
        font-size: 1.05rem;
        margin: 0 0 1rem 0;
        color: #1b1b1b;
      }
      .section-toc-column__list {
        list-style: none;
        padding: 0;
        margin: 0;
        border-top: 1px solid #dfe1e2;
      }
      .section-toc-column__list li {
        border-bottom: 1px solid #dfe1e2;
        margin: 0;
      }
      .section-toc-column__list a {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 0.9rem 0;
        color: #1b1b1b;
        text-decoration: none;
        font-size: 1rem;
        line-height: 1.4;
      }
      .section-toc-column__list a::after {
        content: "→";
        color: #1b1b1b;
        font-size: 1.15rem;
        flex-shrink: 0;
      }
      .section-toc-column__list a:hover {
        text-decoration: underline;
        color: #005ea2;
      }
      .section-toc-column__list a:hover::after { color: #005ea2; }

      /* Content-left + image-right section (`## Heading {.image-right}`).
         Two-column at desktop widths, stacks on narrow screens. */
      .section-image-right {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem 3rem;
        align-items: start;
        margin: 2rem 0;
      }
      .section-image-right__content > *:first-child { margin-top: 0; }
      .section-image-right__image img {
        width: 100%;
        height: auto;
        display: block;
      }
      @media (max-width: 640px) {
        .section-image-right { grid-template-columns: 1fr; }
      }

      /* Card grid (`## Heading {.card-grid}` + table). Each table cell
         becomes a linked card with a bold title, an arrow, and a description
         underneath. Rules separate cards vertically. */
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 0 3rem;
        margin: 2rem 0;
      }
      .card-grid__card {
        display: block;
        padding: 1.25rem 0;
        border-bottom: 1px solid #dfe1e2;
        color: #1b1b1b;
        text-decoration: none;
      }
      .card-grid__title-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        margin-bottom: 0.5rem;
      }
      .card-grid__title {
        font-size: 1.15rem;
        font-weight: 600;
        line-height: 1.3;
      }
      .card-grid__arrow {
        color: #1b1b1b;
        font-size: 1.2rem;
        flex-shrink: 0;
      }
      .card-grid__desc {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.5;
        color: #565c65;
      }
      .card-grid__card:hover .card-grid__title,
      .card-grid__card:hover .card-grid__arrow { color: #005ea2; }
      .card-grid__card:hover .card-grid__title { text-decoration: underline; }
      /* --- Official Maryland site chrome (header + footer) --------------- */

      .usa-skipnav {
        position: absolute;
        left: -999em;
        background: #fff;
        padding: 0.5rem 1rem;
        z-index: 100;
      }
      .usa-skipnav:focus { left: 0; top: 0; position: fixed; }

      /* Zero-specificity fallback for the header container. MDWDS is expected
         to style .maryland-header (padding, full-width). :where() has
         specificity 0, so any real MDWDS rule always wins over this — it
         only applies if this MDWDS build ships nothing. Matches the
         observed mitdp.maryland.gov layout: full width, inline padding. */
      :where(.maryland-header) { padding: 1rem 1.5rem 0; }
      @media (min-width: 55em) {
        :where(.maryland-header) { padding-inline: 3.5rem; }
      }

      /* --- Header: CSS copied verbatim from mitdp.maryland.gov -----------
         MDWDS owns the outer .maryland-header (padding / max-width /
         centering) and the .maryland-header__agency typography. Do NOT set
         max-width or auto margins on the inner __dashboard element — that
         double-centers the header.
         Layout: mobile stacks (title and meta both 100% wide); at >=55em it
         becomes a row with the meta block right-aligned. */
      .maryland-header .maryland-header__dashboard {
        display: inline-flex;
        flex-wrap: wrap;
        row-gap: 2rem;
        align-items: center;
        column-gap: 2rem;
        text-decoration: none;
        width: 100%;
      }
      .maryland-header .maryland-header__dashboard .maryland-header__logo {
        width: auto;
      }
      .maryland-header .maryland-header__dashboard .dashboard-header-title {
        text-decoration: none;
        max-width: 100%;
        line-height: 1.15em;
        width: 100%;
        margin-top: 0;
        margin-bottom: -10px;
      }
      .maryland-header .maryland-header__dashboard .header-meta {
        width: 100%;
        text-align: left;
      }
      .header-meta { font-size: 1rem; }
      .beta-badge {
        background-color: #ffbe2e;
        color: #000;
        font-weight: bold;
        padding: 2px 6px;
        border-radius: 4px;
        margin-right: 8px;
        font-size: 0.9rem;
      }
      .live-badge {
        background-color: #216e1f;
        color: #fff;
        font-weight: bold;
        padding: 2px 6px;
        border-radius: 4px;
        margin-right: 8px;
        font-size: 0.9rem;
      }
      .version-text { font-weight: 600; }
      .update-text {
        display: block;
        font-size: 1rem;
        opacity: 0.9;
        margin-top: 6px;
      }
      .update-link {
        color: #005ea2;
        text-decoration: underline;
        white-space: nowrap;
        padding-left: 6px;
      }
      .maryland-header .maryland-header__divider {
        display: block;
        margin-block-start: 1.5rem;
      }
      @media (min-width: 55em) {
        .maryland-header .maryland-header__dashboard .maryland-header__logo {
          width: 8%;
        }
        .maryland-header .maryland-header__dashboard .dashboard-header-title {
          width: 60%;
        }
        .maryland-header .maryland-header__dashboard .header-meta {
          flex: 1;
          margin-right: 4px;
          margin-top: 0;
          text-align: right;
        }
      }

      /* Zero-specificity fallback for .maryland-header__agency typography.
         MDWDS is expected to supply this; :where() has specificity 0 so any
         real MDWDS rule always wins. Only applies if MDWDS ships nothing. */
      :where(.maryland-header__agency) {
        font-size: 1.75rem;
        font-weight: 700;
        color: #1b1b1b;
      }

      .site-footer {
        background-color: #1a4480;   /* MDWDS primary-darker */
        color: #fff;
        padding: 30px 0;
        margin-top: 36px;
      }
      .site-footer__content {
        max-width: 87.5rem;
        margin: 0 auto;
        padding: 0 1.5rem;
      }
      .site-footer__title {
        font-weight: 700;
        font-size: 1rem;
        line-height: 1.2rem;
        margin-bottom: 10px;
        max-width: 800px;
      }
      .site-footer__text {
        margin: 0 0 15px;
        line-height: 1.2rem;
        opacity: 0.9;
        max-width: 800px;
        font-size: 1rem;
      }
      @media (min-width: 55em) {
        .site-footer__content { padding-inline: 3.5rem; }
      }
      .site-footer__links { display: flex; gap: 15px; flex-wrap: wrap; }
      .site-footer__link { color: #fff; text-decoration: underline; font-size: 1rem; }
      .site-footer__link:visited { color: #fff; }
      .site-footer__link:hover { color: #dfe1e2; }

/* --- Breadcrumbs -------------------------------------------------- */
      .breadcrumb-wrap{max-width:var(--maxw);margin:0 auto;padding:0rem 24px 0;}

      /* Zero-specificity fallbacks; real MDWDS breadcrumb rules win. */
      :where(.usa-breadcrumb) { font-size: 0.95rem; }
      :where(.usa-breadcrumb__list) {
        list-style: none; display: flex; flex-wrap: wrap;
        margin: 0; padding: 0; align-items: center;
      }
      :where(.usa-breadcrumb__list-item + .usa-breadcrumb__list-item)::before {
        content: ""; margin: 0 0.15rem; color: #71767a;
      }
      :where(.usa-breadcrumb__list-item + .usa-breadcrumb__list-item)::after {
        margin: 0 0.15rem;
      }
      :where(.usa-breadcrumb__link) { color: #005ea2; }
      :where(.usa-breadcrumb__list-item.usa-current span) { color: #1b1b1b; }

      /* --- Section sidebar (maryland.gov/services pattern) --------------- */
      .layout-sidebar {
        /* max-width: 72rem;  */
        margin: 0 auto;
        padding: 0 0 3rem;
        display: grid; grid-template-columns: 1fr; gap: 1.5rem;
      }
      .layout-sidebar > .usa-prose { padding: 0; margin: 0; max-width: none; }
      .page-lede { padding-bottom: 2.5rem; padding-top: 0}

      .section-nav__toggle {
        display: flex; justify-content: space-between; align-items: center;
        background: #1b1b1b; color: #fff;
        font-weight: 700; font-size: 1rem;
        padding: 0.9rem 1.25rem; border-radius: 6px;
        cursor: pointer; list-style: none;
      }
      .section-nav__toggle::-webkit-details-marker { display: none; }
      .section-nav__toggle::after { content: "\2304"; font-size: 1.1rem; line-height: 0.5; }
      .section-nav__details[open] .section-nav__toggle::after { content: "\2303"; }
      .section-nav__body { padding-top: 1rem; }
      .section-nav__back {
        display: block; font-weight: 700; color: #1b1b1b;
        text-decoration: none; padding-bottom: 0.75rem;
        border-bottom: 1px solid #dfe1e2; margin-bottom: 0.25rem;
      }
      .section-nav__back:hover { text-decoration: underline; }
      .section-nav__list, .section-nav__sublist { list-style: none; margin: 0; padding: 0; }
      .section-nav__item { border-bottom: 1px solid #dfe1e2; padding: 0.6rem 0; }
      .section-nav__item--sub { border-bottom: 0; padding: 0.35rem 0 0.35rem 1rem; }
      .section-nav__sublist { margin-top: 0.35rem; }
      .section-nav__link {
        color: #1b1b1b; text-decoration: none; font-size: 0.98rem; line-height: 1.35;
      }
      .section-nav__link:hover { text-decoration: underline; color: #005ea2; }
      .section-nav__link.is-current { font-weight: 700; }
      .section-nav__item--sub .section-nav__link { font-size: 0.92rem; }

      @media (min-width: 55em) {
        .layout-sidebar { grid-template-columns: 230px minmax(0, 1fr); gap: 3rem; }
        .section-nav__toggle { display: none; }
        .section-nav__body { border-top: 3px solid #1b1b1b; }
      }

      .site-footer {
        background-color: #1a4480;   /* MDWDS primary-darker */
        color: #fff;
        padding: 30px 0;
        margin-top: 36px;
      }
      .site-footer__content {
        max-width: 87.5rem;
        margin: 0 auto;
        padding: 0 1.5rem;
      }
      .site-footer__title {
        font-weight: 700;
        font-size: 1rem;
        line-height: 1.2rem;
        margin-bottom: 10px;
        max-width: 800px;
      }
      .site-footer__text {
        margin: 0 0 15px;
        line-height: 1.2rem;
        opacity: 0.9;
        max-width: 800px;
        font-size: 1rem;
      }
      @media (min-width: 55em) {
        .site-footer__content { padding-inline: 3.5rem; }
      }

      .site-footer__links { display: flex; gap: 15px; flex-wrap: wrap; }
      .site-footer__link { color: #fff; text-decoration: underline; font-size: 1rem; }
      .site-footer__link:visited { color: #fff; }
      .site-footer__link:hover { color: #dfe1e2; }

      .breadcrumb-wrap{max-width:var(--maxw);margin:0 auto;padding:0rem 24px 0;}

      @media (min-width: 55em) {
        .maryland-header{padding-left: 1.5rem; padding-right: 1.5rem}
        .usa-banner__inner{padding-left: 1.5rem; padding-right: 1.5rem}
      }

      /* NOTE: this is a hack so that the first item lines up with the sidebar */
      .usa-prose h2#why-do-i-need-a-launchpad,
      .usa-prose h2#overview {
        margin-top: 0rem;
      }
      /* END of NOTE: that was a hack so that the first item lines up with the sidebar */




</style>
  </head>
  <body>
    <div class="site-chrome site-chrome--header">{{SITE_HEADER}}</div>

    {{BREADCRUMB}}

    <!-- CONTENT brings its own wrappers: a .usa-prose div (and, when the
         page declares a sidebar, a .layout-sidebar grid). Markdown content
         is always a DIRECT child of a .usa-prose element so the MDWDS
         `.usa-prose > *` typography and table styles apply. -->
    <main id="main-content" class="usa-prose">
      {{CONTENT}}
    </main>

    <div class="site-chrome site-chrome--footer">{{SITE_FOOTER}}</div>

 <script>
      /* The section sidebar is a <details> accordion on mobile; keep it
         forced open on desktop widths so the rail is always visible. */
      (function () {
        var mq = window.matchMedia("(min-width: 55em)");
        function sync() {
          if (!mq.matches) return;
          document.querySelectorAll(".section-nav__details").forEach(function (d) { d.open = true; });
        }
        if (mq.addEventListener) mq.addEventListener("change", sync);
        sync();
      })();
    </script>
  </body>
</html>
